<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Apex Bike Rental</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-image: url('assets/BgimgBike.jpeg'); background-size: cover; background-position: center;">

  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="logo">
      <img src="assets/BikeRentalLogo.jpeg" alt="Logo">
      <span>Apex Bike Rental</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="bikes.html">Bikes</a>
      <a href="about.html">About</a>
      <a href="owner.html">For Owners</a>
    </nav>
  </header>

  <!-- Signup Card -->
  <div class="form-container">
    <div class="form-card">
      <h2>Create Account</h2>
      <p class="subtitle">Join Apex Bike Rental</p>

      <form id="signupForm">
        <input type="text" id="fullName" placeholder="Full Name" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password (min 6)" required minlength="6">
        <button type="submit">Sign Up</button>
      </form>

      <p class="switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

</body>
</html>
