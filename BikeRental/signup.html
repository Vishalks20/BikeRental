    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/BikeRentalLogo.jpeg" alt="Logo" width="40" height="40" class="me-2 rounded-circle">
        <span>Apex Bike Rental</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
      <div class="card-body">
        <h2 class="card-title text-center mb-2">Create Account</h2>
        <p class="text-center text-muted mb-4">Join Apex Bike Rental</p>
        <form action="php/signup.php" method="POST">
          <div class="mb-3">
            <input type="text" class="form-control" name="fullName" placeholder="Full Name" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" name="signupEmail" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" name="signupPassword" placeholder="Password (min 6)" required minlength="6">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Sign Up</button>
          </div>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
