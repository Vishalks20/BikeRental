<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List Your Bike - Apex Bike Rental</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-image: url('assets/BgimgBike.jpeg'); background-size: cover; background-position: center;">

  <header class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/BikeRentalLogo.jpeg" alt="Logo" width="40" height="40" class="me-2 rounded-circle">
        <span>Apex Bike Rental</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="bikes.html">Bikes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="owner.html">For Owners</a>
          </li>
        </ul>
        <a href="login.html" class="btn btn-danger">Login</a>
      </div>
    </div>
  </header>

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-lg" style="max-width: 450px; width: 100%;">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">List Your Bike</h2>
        <form id="ownerForm" action="php/owner.php" method="POST">
          <div class="mb-3">
            <input type="text" class="form-control" id="ownerName" placeholder="Owner Name" name="ownerName" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" id="ownerEmail" placeholder="Owner Email" name="ownerEmail" required>
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" id="bikeName" placeholder="Bike Name (e.g., Royal Enfield)" name="bikeName" required>
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" id="bikeType" placeholder="Bike Type (e.g., Scooter, Sports, Cruiser)" name="bikeType" required>
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" id="bikeLocation" placeholder="City/Region (e.g., Delhi, Ladakh)" name="bikeLocation" required>
          </div>
          <div class="mb-3">
            <input type="number" class="form-control" id="bikePrice" placeholder="Price per Day (₹)" name="bikePrice" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Submit Bike</button>
          </div>
        </form>
        <p id="ownerMsg" class="mt-3 text-center"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const ownerMsg = document.getElementById('ownerMsg');

      if (urlParams.get('success')) {
        ownerMsg.textContent = '✅ Thank you! Your bike has been submitted for review.';
        ownerMsg.className = 'mt-3 text-center text-success';
      } else if (urlParams.get('error')) {
        ownerMsg.textContent = '❌ An error occurred. Please try again.';
        ownerMsg.className = 'mt-3 text-center text-danger';
      }
    });
  </script>

</body>
</html>
