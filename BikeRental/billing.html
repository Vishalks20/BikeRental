<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing - Apex Bike Rental</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-image: url('assets/BgimgBike.jpeg'); background-size: cover;">

  <header class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/BikeRentalLogo.jpeg" alt="Logo" width="40" height="40" class="me-2 rounded-circle">
        <span>Apex Bike Rental</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="bikes.html">Bikes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="owner.html">For Owners</a>
          </li>
        </ul>
        <a href="login.html" class="btn btn-danger">Login</a>
      </div>
    </div>
  </header>

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-lg text-dark" style="max-width: 500px; width: 100%;">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Booking Summary</h2>
        <div class="bg-light p-3 rounded mb-3" id="bookingSummary"></div>

        <button class="btn btn-primary w-100" onclick="showPayment()">Proceed to Payment</button>

        <div id="paymentSection" style="display:none; margin-top:20px;">
          <h3 class="card-subtitle mb-3 text-center">Payment Details</h3>
          <form id="paymentForm">
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Cardholder Name" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Card Number" required maxlength="16">
            </div>
            <div class="row mb-3">
              <div class="col-6">
                <input type="text" class="form-control" placeholder="MM/YY" required maxlength="5">
              </div>
              <div class="col-6">
                <input type="text" class="form-control" placeholder="CVV" required maxlength="3">
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success">Pay Now</button>
            </div>
          </form>
        </div>

        <p id="confirmationMsg" class="text-success fw-bold text-center mt-3" style="display:none;"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Get booking details from URL
    const params = new URLSearchParams(window.location.search);
    const bike = params.get("bike");
    const fullName = params.get("fullName");
    const region = params.get("region");
    const startDate = new Date(params.get("startDate"));
    const endDate = new Date(params.get("endDate"));

    const perDayPrice = 1500;
    let days = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));
    if (days < 1) days = 1;

    const total = days * perDayPrice;

    document.getElementById("bookingSummary").innerHTML = `
      <strong>Name:</strong> ${fullName}<br>
      <strong>Bike:</strong> ${bike}<br>
      <strong>Region:</strong> ${region}<br>
      <strong>From:</strong> ${startDate.toDateString()}<br>
      <strong>To:</strong> ${endDate.toDateString()}<br>
      <strong>Duration:</strong> ${days} day(s)<br>
      <strong>Charges:</strong> ₹${perDayPrice} per day<br>
      <strong>Total Amount:</strong> <span class="text-danger fw-bold fs-5">₹${total}</span>
    `;

    function showPayment() {
      document.getElementById("paymentSection").style.display = "block";
    }

    document.getElementById("paymentForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("paymentSection").style.display = "none";
      document.getElementById("confirmationMsg").style.display = "block";
      document.getElementById("confirmationMsg").textContent = "✅ Payment Successful! Your booking is confirmed.";
    });
  </script>

</body>
</html>
