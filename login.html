<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Apex Bike Rental</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-image: url('assets/BgimgBike.jpeg'); background-size: cover; background-position: center;">

  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="logo">
      <img src="assets/BikeRentalLogo.jpeg" alt="Logo">
      <span>Apex Bike Rental</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="bikes.html">Bikes</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- Login Card -->
  <div class="form-container">
    <div class="form-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue</p>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required minlength="6">
        <button type="submit">Login</button>
      </form>

      <p class="switch">Don’t have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

</body>
</html>
